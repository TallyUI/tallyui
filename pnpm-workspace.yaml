packages:
  - "apps/*"
  - "packages/*"
  - "connectors/*"
minimumReleaseAge: 1440
blockExoticSubdeps: true
minimumReleaseAgeIgnoreMissingTime: true
# Build-script allowlist moved from package.json for pnpm 11.
allowBuilds:
  rxdb: true
  protobufjs: true
  "@firebase/util": true
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: false
  # rxdb-premium's postinstall decrypts the licensed plugins (token: RXDB_PREMIUM env var).
  rxdb-premium: true
  core-js: false
  eccrypto: false
  secp256k1: false
