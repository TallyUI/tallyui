# Its own pnpm root, so it is never part of the TallyUI workspace (the root globs packages/* one level).
packages:
  - "."
# Never keep post-install builds in the store: rxdb-premium's postinstall decrypts licensed
# code, and a cached store would carry it (ADR-044).
sideEffectsCache: false
allowBuilds:
  rxdb: true
  protobufjs: true
  "@firebase/util": true
  # rxdb-premium's postinstall decrypts the licensed plugins (token: RXDB_PREMIUM env var).
  rxdb-premium: true
  core-js: false
  eccrypto: false
  secp256k1: false
