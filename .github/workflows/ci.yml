name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's lastmod is each page's last commit (apps/web/src/lib/page-dates.ts).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # setup-node v5+ caches the package manager's store by default when package.json has
          # `packageManager`. Never cache it here (docs/CONTRIBUTING.md). v4 warns it has no such input; harmless.
          package-manager-cache: false

      - name: Check no pnpm store was restored from a cache
        run: test ! -e "$(pnpm store path)"

      - run: pnpm install --frozen-lockfile
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}

      # rxdb-premium's postinstall decrypts licensed code. pnpm's side-effects cache would keep
      # that build in the store, and this public repo's caches are readable by fork PRs, so
      # the store is never cached and the setting must stay off (pnpm-workspace.yaml).
      - name: Check pnpm keeps no post-install builds in its store
        run: test "$(pnpm config get side-effects-cache)" = false

      - name: Check workspace dependency declarations
        run: pnpm check:deps

      - name: Check the release plan has no unrequested major
        run: pnpm check:release-plan

      - name: Build packages
        run: pnpm build

      - name: Check core's dist stays RxDB-free
        run: pnpm check:core-dist

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Pack and install smoke test
        run: pnpm smoke:pack

      - name: Lint docs site
        run: pnpm --filter @tallyui/web lint

      - name: Build docs site
        run: cd apps/web && npx next build

      # Next two crawl built docs from /; fail on any broken internal link (marketing backlog #87)
      - name: Start the built docs site
        working-directory: apps/web
        run: |
          pnpm start --port 3000 > /tmp/next-start.log 2>&1 &
          for _ in {1..30}; do
            if curl -sf -o /dev/null http://localhost:3000/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/next-start.log
          exit 1

      - name: Check internal links
        run: pnpm --filter @tallyui/web links:check

  e2e-web:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # setup-node v5+ caches the package manager's store by default when package.json has
          # `packageManager`. Never cache it here (docs/CONTRIBUTING.md). v4 warns it has no such input; harmless.
          package-manager-cache: false

      - name: Check no pnpm store was restored from a cache
        run: test ! -e "$(pnpm store path)"

      - run: pnpm install --frozen-lockfile
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}

      # rxdb-premium's postinstall decrypts licensed code. pnpm's side-effects cache would keep
      # that build in the store, and this public repo's caches are readable by fork PRs, so
      # the store is never cached and the setting must stay off (pnpm-workspace.yaml).
      - name: Check pnpm keeps no post-install builds in its store
        run: test "$(pnpm config get side-effects-cache)" = false

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the e2e port and server-identity checks
        run: node --test e2e/port-free.test.mjs e2e/server-identity.test.mjs

      - name: Run Playwright tests
        run: pnpm test:e2e:web

      # The CI reporter is 'github', so this uploads nothing today. Never upload an HTML report,
      # traces or test-results/: they capture the storage-sqlite worker bundle, which contains
      # the decrypted RxDB Premium plugins (docs/CONTRIBUTING.md).
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
