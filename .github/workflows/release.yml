name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# The TallyUI org forbids GitHub Actions from opening pull requests, so this
# workflow never versions. A worker opens the version PR (docs/RELEASING.md);
# once it is merged and no changesets are pending, this workflow publishes.
jobs:
  pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.count.outputs.changesets }}
    steps:
      - uses: actions/checkout@v4

      - name: Count pending changesets
        id: count
        run: echo "changesets=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

  release:
    needs: pending
    if: needs.pending.outputs.changesets == '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing (OIDC): no npm token exists; each package trusts this workflow file by name.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish unpublished versions
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
