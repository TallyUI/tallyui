name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# The TallyUI org forbids GitHub Actions from opening pull requests, so this
# workflow never versions. A worker opens the version PR (docs/RELEASING.md);
# once it is merged and no changesets are pending, this workflow publishes.
jobs:
  pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.count.outputs.changesets }}
    steps:
      - uses: actions/checkout@v4

      - name: Count pending changesets
        id: count
        run: echo "changesets=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

  release:
    needs: pending
    if: needs.pending.outputs.changesets == '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing (OIDC): no npm token exists; each package trusts this workflow file by name.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # setup-node v5+ caches the package manager's store by default when package.json has
          # `packageManager`. Never cache it here (docs/CONTRIBUTING.md). v4 warns it has no such input; harmless.
          package-manager-cache: false

      - name: Check no pnpm store was restored from a cache
        run: test ! -e "$(pnpm store path)"

      - run: pnpm install --frozen-lockfile
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}

      # rxdb-premium's postinstall decrypts licensed code. pnpm's side-effects cache would keep
      # that build in the store, and this public repo's caches are readable by fork PRs, so
      # the store is never cached and the setting must stay off (pnpm-workspace.yaml).
      - name: Check pnpm keeps no post-install builds in its store
        run: test "$(pnpm config get side-effects-cache)" = false

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Pack and install smoke test
        run: pnpm smoke:pack

      - name: Publish unpublished versions
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
